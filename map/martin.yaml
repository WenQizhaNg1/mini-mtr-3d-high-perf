# yaml-language-server: $schema=https://raw.githubusercontent.com/maplibre/martin/main/schemas/config.json

listen_addresses: 0.0.0.0:3000
worker_processes: 2
preferred_encoding: gzip
web_ui: enable-for-all

cache:
  size_mb: 128
  tile_size_mb: 96

mbtiles:
  sources:
    osm:
      path: /map/hong-kong.mbtiles

postgres:
  connection_string: ${MARTIN_DATABASE_URL}
  pool_size: 4
  auto_publish: false
  functions:
    features:
      schema: app
      function: dataset_tile
      cache: disable
    transit:
      schema: app
      function: transit_tile
      cache: disable

fonts:
  paths:
    - /map/font
  cache:
    size_mb: 32

sprites:
  cache:
    size_mb: 16
  sources:
    osm-liberty: /map/sprites/osm-liberty
    positron: /map/sprites/positron

styles:
  rendering:
    enabled: false
  sources:
    positron: /map/style/positron/style.json
    osm-liberty-dark: /map/style/osm-liberty-dark/style.json
